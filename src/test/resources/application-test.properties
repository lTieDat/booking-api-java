spring.datasource.url=jdbc:h2:mem:booking_api;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

app.jwtSecret=test-secret-key-for-booking-api-must-be-at-least-256-bits-long-xxx
app.jwtExpirationInMs=3600000

app.cors.allowedOrigins=*

app.storage.minio.endpoint=http://localhost:9000
app.storage.minio.publicEndpoint=http://localhost:9000
app.storage.minio.accessKey=minioadmin
app.storage.minio.secretKey=minioadmin
app.storage.minio.bucket=booking-assets
app.storage.minio.autoCreateBucket=true
app.storage.minio.publicRead=true
