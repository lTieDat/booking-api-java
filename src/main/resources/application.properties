spring.application.name=booking-api

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking_api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

app.jwtSecret=${JWT_SECRET:booking-api-jwt-secret-key-must-be-at-least-256-bits-long}
app.jwtExpirationInMs=3600000

app.booking.pending-expiration-minutes=${BOOKING_PENDING_EXPIRATION_MINUTES:15}

app.scheduler.pool-size=${APP_SCHEDULER_POOL_SIZE:2}
app.scheduler.thread-name-prefix=${APP_SCHEDULER_THREAD_NAME_PREFIX:booking-api-scheduler-}

app.jobs.booking-expiration.enabled=${BOOKING_EXPIRATION_JOB_ENABLED:true}
app.jobs.booking-expiration.fixed-delay-ms=${BOOKING_EXPIRATION_JOB_FIXED_DELAY_MS:60000}
app.jobs.payment-reconciliation.enabled=${PAYMENT_RECONCILIATION_JOB_ENABLED:true}
app.jobs.payment-reconciliation.fixed-delay-ms=${PAYMENT_RECONCILIATION_JOB_FIXED_DELAY_MS:300000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false
app.booking.idempotency.processing-ttl-seconds=${BOOKING_IDEMPOTENCY_PROCESSING_TTL_SECONDS:900}
app.booking.idempotency.completed-ttl-seconds=${BOOKING_IDEMPOTENCY_COMPLETED_TTL_SECONDS:86400}

app.cors.allowedOrigins=*

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.publicEndpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
app.storage.minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
app.storage.minio.bucket=${MINIO_BUCKET:booking-assets}
app.storage.minio.autoCreateBucket=${MINIO_AUTO_CREATE_BUCKET:true}
app.storage.minio.publicRead=${MINIO_PUBLIC_READ:true}

app.payment.payos.enabled=${PAYOS_ENABLED:false}
app.payment.payos.client-id=${PAYOS_CLIENT_ID:}
app.payment.payos.api-key=${PAYOS_API_KEY:}
app.payment.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payment.payos.return-url=${PAYOS_RETURN_URL:http://localhost:3000/payment/payos/return}
app.payment.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:3000/payment/payos/cancel}

logging.level.root=INFO
logging.level.com.example.bookingapi=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%thread]){magenta} %clr([req:%X{requestId:-none}]){yellow} %clr(%logger{36}){cyan} %clr(=>){faint} %msg%n
