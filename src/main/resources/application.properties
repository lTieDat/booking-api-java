spring.application.name=booking-api

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking_api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

app.jwtSecret=${JWT_SECRET:booking-api-jwt-secret-key-must-be-at-least-256-bits-long}
app.jwtExpirationInMs=3600000

app.cors.allowedOrigins=*

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.publicEndpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
app.storage.minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
app.storage.minio.bucket=${MINIO_BUCKET:booking-assets}
app.storage.minio.autoCreateBucket=${MINIO_AUTO_CREATE_BUCKET:true}
app.storage.minio.publicRead=${MINIO_PUBLIC_READ:true}
